name: ML_sdfi
channels:
  - fastai
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch>=2.6.0
  - torchvision
  - pytorch-cuda=12.1
  - geopandas
  - gdal
  - fiona
  - psutil
  - rasterio
  - ipython  # Add this - needed by fastai
  - jupyter  # Good to have
  - matplotlib  # Usually needed
  - pip
  - pip:
      - fastai>=2.7.14
      - git+https://github.com/rasmuspjohansson/albumentations-multi-channels
      - git+https://github.com/walkwithfastai/walkwithfastai.github.io
      - git+https://github.com/SDFIdk/multi_channel_dataset_creation.git
      - psycopg2-binary
      - reportlab
      - transformers>=4.44,<5  # SegFormer / Swin UPerNet; 5.x needs newer torch than 2.6
      - safetensors>=0.4.0
